name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  config-and-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer round trips, rotation decisions and focus parsing
        run: python3 -m unittest discover -s tests -v
      - name: Script syntax
        run: |
          bash -n setup-system
          python3 -m py_compile install uninstall build-keyboard bin/pixelbook-osk bin/pixelbook-autorotate
